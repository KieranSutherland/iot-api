name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.15.0.cjs install

      - name: Build workspace packages (exclude frontend)
        run: node .yarn/releases/yarn-4.15.0.cjs workspaces foreach -Apt --exclude iot-frontend --jobs 4 run build

      - name: Run tests (exclude frontend)
        run: node .yarn/releases/yarn-4.15.0.cjs workspaces foreach -Ap --exclude iot-frontend --jobs 4 run run-tests-once
